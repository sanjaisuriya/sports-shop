<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Manage Products – Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex min-h-screen">

  <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 shrink-0">
    <a href="index.html" class="flex items-center gap-2 mb-8"><div class="bg-red-600 text-white p-1.5 rounded font-black text-lg">SH</div><span class="font-black text-xl text-white">Admin<span class="text-red-600">Hub</span></span></a>
    <nav class="space-y-1 text-xs font-semibold">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300"><i class="fa-solid fa-chart-line w-4 text-red-500"></i> Dashboard</a>
      <a href="products.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-red-600 text-white"><i class="fa-solid fa-boxes-stacked w-4"></i> Products</a>
      <a href="categories.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300"><i class="fa-solid fa-tags w-4 text-red-500"></i> Categories</a>
      <a href="brands.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300"><i class="fa-solid fa-copyright w-4 text-red-500"></i> Brands</a>
      <a href="orders.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300"><i class="fa-solid fa-cart-shopping w-4 text-red-500"></i> Orders</a>
      <a href="customers.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300"><i class="fa-solid fa-users w-4 text-red-500"></i> Customers</a>
      <a href="team-kit-requests.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300"><i class="fa-solid fa-shirt w-4 text-red-500"></i> Kit Requests</a>
      <a href="bulk-enquiries.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300"><i class="fa-solid fa-truck-ramp-box w-4 text-red-500"></i> Bulk Enquiries</a>
    </nav>
  </aside>

  <main class="flex-1 p-8 space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-black">PRODUCT INVENTORY MANAGEMENT</h1>
      <a href="add-product.html" class="btn-sh-primary text-xs py-2.5 px-4"><i class="fa-solid fa-plus mr-1"></i> Add Product</a>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-800 text-slate-400 uppercase font-bold">
          <tr>
            <th class="p-3">SKU</th>
            <th class="p-3">Product Name</th>
            <th class="p-3">Category</th>
            <th class="p-3">Price</th>
            <th class="p-3">Stock Qty</th>
            <th class="p-3">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800 text-slate-300" id="adminProductsTable"></tbody>
      </table>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('../data/products.json')
        .then(r => r.json())
        .then(products => {
          const tbody = document.getElementById('adminProductsTable');
          tbody.innerHTML = products.map(p => `
            <tr id="product-${p.id}">
              <td class="p-3 font-bold">${p.sku}</td>
              <td class="p-3 font-bold text-white">${p.name}</td>
              <td class="p-3 text-red-400 font-bold">${p.category}</td>
              <td class="p-3 font-bold">$${p.price.toFixed(2)}</td>
              <td class="p-3">${p.stockQty} Units</td>
              <td class="p-3 space-x-2">
                <a href="edit-product.html?id=${p.id}" class="text-blue-400 hover:underline"><i class="fa-solid fa-pen"></i></a>
                <button onclick="window.deleteAdminItem('product', '${p.id}')" class="text-red-400 hover:underline"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          `).join('');
        });
    });
  </script>
</body>
</html>
