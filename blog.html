<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports & Equipment Blog – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl leading-none">SH</div>
        <span class="font-black text-xl text-slate-900 dark:text-white tracking-tight">SPORTS<span class="text-red-600">HUB</span></span>
      </a>
      <nav class="hidden lg:flex items-center gap-6 font-semibold text-sm text-slate-700 dark:text-slate-200">
        <a href="index.html" class="hover:text-red-600">Home</a>
        <a href="cricket-home.html" class="hover:text-red-600">Cricket Special</a>
        <a href="shop.html" class="hover:text-red-600">Shop Catalog</a>
        <a href="categories.html" class="hover:text-red-600">Categories</a>
        <a href="brands.html" class="hover:text-red-600">Brands</a>
        <a href="blog.html" class="text-red-600 font-bold">Blog</a>
        <a href="contact.html" class="hover:text-red-600">Contact</a>
      </nav>
      <div class="flex items-center gap-4">
        <button onclick="window.toggleTheme()" class="hover:text-red-600 text-xs font-bold transition flex items-center gap-1">
          <i class="fa-solid fa-moon sh-theme-icon-moon"></i>
          <i class="fa-solid fa-sun sh-theme-icon-sun hidden text-amber-400"></i>
          <span class="sh-theme-text">Theme</span>
        </button>
        <a href="cart.html" class="relative p-2 text-slate-700 dark:text-slate-200">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span class="sh-cart-count absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </a>
      </div>
    </div>
  </header>

  <section class="bg-slate-900 text-white py-12 text-center">
    <h1 class="text-3xl lg:text-5xl font-black">SPORTSHUB INSIGHTS & GUIDES</h1>
    <p class="text-slate-300 text-sm max-w-xl mx-auto mt-2">Equipment reviews, fitness tips, and tactical coaching guides written by professional athletes.</p>
    
    <div class="max-w-md mx-auto mt-6 px-4">
      <input type="text" id="blogSearch" placeholder="Search articles by title or keyword..." class="w-full bg-slate-800 border border-slate-700 text-white rounded-full py-2.5 px-5 text-xs focus:outline-none focus:border-red-600">
    </div>
  </section>

  <main class="py-12 flex-1">
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="blogGrid">
      <p class="col-span-full text-center text-slate-500 py-12">Loading articles...</p>
    </div>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-8 text-center text-xs border-t border-slate-800 mt-auto">
    &copy; 2026 SportsHub Media & Insights.
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let allPosts = [];
      
      function renderPosts(posts) {
        const grid = document.getElementById('blogGrid');
        if (!grid) return;
        if (posts.length === 0) {
          grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-12">No blog articles match your search.</p>';
          return;
        }
        grid.innerHTML = posts.map(b => `
          <article class="sh-card overflow-hidden group flex flex-col justify-between">
            <div>
              <div class="h-48 overflow-hidden relative">
                <img src="${b.image}" alt="${b.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                <span class="absolute top-3 left-3 bg-red-600 text-white text-[10px] font-black uppercase px-2.5 py-1 rounded shadow">${b.category}</span>
              </div>
              <div class="p-5">
                <div class="flex items-center gap-3 text-xs text-slate-400 mb-2">
                  <span><i class="fa-regular fa-calendar mr-1"></i> ${b.date}</span>
                  <span>•</span>
                  <span><i class="fa-regular fa-clock mr-1"></i> ${b.readTime}</span>
                </div>
                <h3 class="font-bold text-slate-900 dark:text-white text-base hover:text-red-600 transition leading-snug mb-2">
                  <a href="blog-details.html?id=${b.id}">${b.title}</a>
                </h3>
                <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-3">${b.summary}</p>
              </div>
            </div>
            <div class="px-5 pb-5 pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <span class="text-xs font-semibold text-slate-500">By ${b.author}</span>
              <a href="blog-details.html?id=${b.id}" class="text-xs font-bold text-red-600 hover:text-red-700">Read Article <i class="fa-solid fa-arrow-right ml-1"></i></a>
            </div>
          </article>
        `).join('');
      }

      fetch('data/blog.json')
        .then(r => r.json())
        .then(posts => {
          allPosts = posts;
          renderPosts(allPosts);
        })
        .catch(() => {
          allPosts = window.BLOG_DATA || [];
          renderPosts(allPosts);
        });

      const searchInput = document.getElementById('blogSearch');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase();
          const filtered = allPosts.filter(b => b.title.toLowerCase().includes(q) || b.summary.toLowerCase().includes(q) || b.category.toLowerCase().includes(q));
          renderPosts(filtered);
        });
      }
    });
  </script>
</body>
</html>
