<!-- Navigation Bar Component -->
<header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 transition-colors">
  <!-- Main Navbar -->
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <!-- Brand Logo -->
    <a href="index.html" class="flex items-center gap-2">
      <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl leading-none">SH</div>
      <div class="flex flex-col">
        <span class="font-black text-xl text-slate-900 dark:text-white tracking-tight leading-tight">SPORTS<span class="text-red-600">HUB</span></span>
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest leading-none">Sports & Cricket Store</span>
      </div>
    </a>

    <!-- Navigation Links -->
    <nav class="hidden lg:flex items-center gap-6 font-semibold text-sm text-slate-700 dark:text-slate-200">
      <!-- Home Dropdown -->
      <div class="relative group py-2">
        <a href="index.html" class="inline-flex items-center gap-1.5 hover:text-red-600 transition font-bold py-1">
          <span>HOME</span>
          <i class="fa-solid fa-chevron-down text-[11px] transition-transform duration-200 group-hover:rotate-180"></i>
        </a>
        <div class="absolute left-0 top-full hidden group-hover:block bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl min-w-[210px] py-2 z-50 animate-fade-in">
          <a href="index.html" class="flex items-center justify-between px-4 py-2.5 text-xs font-bold text-slate-800 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-red-600 transition">
            <span>HOME 1</span>
            <span class="text-[10px] font-normal text-slate-400">Multi-Sport Store</span>
          </a>
          <a href="cricket-home.html" class="flex items-center justify-between px-4 py-2.5 text-xs font-bold text-slate-800 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-red-600 transition border-t border-slate-100 dark:border-slate-800/60">
            <span>HOME 2</span>
            <span class="text-[10px] font-normal text-slate-400">Cricket Store</span>
          </a>
        </div>
      </div>

      <a href="categories.html" class="hover:text-red-600 transition">Categories</a>
      <a href="about.html" class="hover:text-red-600 transition">About Us</a>
      <a href="services.html" class="hover:text-red-600 transition">Services</a>
      <a href="pricing.html" class="hover:text-red-600 transition">Pricing</a>
      <a href="blog.html" class="hover:text-red-600 transition">Blog</a>
      <a href="contact.html" class="hover:text-red-600 transition">Contact</a>
    </nav>

    <!-- Right Controls: RTL, Theme, Cart, Wishlist, User -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- RTL/LTR Toggle Icon Logo -->
      <button onclick="window.toggleRTL()" class="p-2 text-slate-700 dark:text-slate-200 hover:text-red-600 transition text-lg" title="Toggle Layout Direction (RTL / LTR)">
        <i class="fa-solid fa-right-left"></i>
      </button>

      <!-- Theme Dark/Light Mode Toggle -->
      <button onclick="window.toggleTheme()" class="p-2 text-slate-700 dark:text-slate-200 hover:text-red-600 transition text-xs font-bold flex items-center gap-1" title="Toggle Dark/Light Mode">
        <i class="fa-solid fa-moon sh-theme-icon-moon text-base"></i>
        <i class="fa-solid fa-sun sh-theme-icon-sun hidden text-amber-400 text-base"></i>
      </button>

      <!-- Wishlist -->
      <a href="wishlist.html" class="relative p-2 text-slate-700 dark:text-slate-200 hover:text-red-600 transition" title="Wishlist">
        <i class="fa-regular fa-heart text-lg"></i>
        <span class="sh-wishlist-count absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </a>

      <!-- Cart -->
      <a href="cart.html" class="relative p-2 text-slate-700 dark:text-slate-200 hover:text-red-600 transition" title="Cart">
        <i class="fa-solid fa-cart-shopping text-lg"></i>
        <span class="sh-cart-count absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </a>

      <!-- Login / Account -->
      <a href="login.html" class="p-2 text-slate-700 dark:text-slate-200 hover:text-red-600 transition" title="Login / Register Account">
        <i class="fa-regular fa-circle-user text-lg"></i>
      </a>

      <!-- Mobile Hamburger Button -->
      <button onclick="document.getElementById('mobileNav').classList.toggle('hidden')" class="lg:hidden p-2 text-slate-800 dark:text-slate-100 text-lg">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div id="mobileNav" class="hidden lg:hidden bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 grid grid-cols-2 gap-2 text-sm font-semibold">
    <div class="col-span-2 bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 mb-1">
      <span class="text-[11px] font-bold text-slate-400 uppercase block mb-1.5 px-1">Homepage Variations</span>
      <div class="grid grid-cols-2 gap-2">
        <a href="index.html" class="p-2 text-xs font-bold text-slate-800 dark:text-slate-200 hover:bg-white dark:hover:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-700 text-center">
          HOME 1
          <span class="block text-[9px] font-normal text-slate-400 mt-0.5">Multi-Sport</span>
        </a>
        <a href="cricket-home.html" class="p-2 text-xs font-bold text-slate-800 dark:text-slate-200 hover:bg-white dark:hover:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-700 text-center">
          HOME 2
          <span class="block text-[9px] font-normal text-slate-400 mt-0.5">Cricket Store</span>
        </a>
      </div>
    </div>
    <a href="categories.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">Categories</a>
    <a href="about.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">About Us</a>
    <a href="services.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">Services</a>
    <a href="pricing.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">Pricing</a>
    <a href="blog.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">Blog</a>
    <a href="contact.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded">Contact</a>
    <a href="customer/dashboard.html" class="p-2 text-blue-600 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 rounded">Customer Portal</a>
    <a href="admin/index.html" class="p-2 text-purple-600 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 rounded">Admin Portal</a>
  </div>
</header>
