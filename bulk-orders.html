<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Orders & Institutional Sales – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl leading-none">SH</div>
        <span class="font-black text-xl text-slate-900 dark:text-white tracking-tight">BULK<span class="text-red-600">SUPPLY</span></span>
      </a>
      <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-red-600"><i class="fa-solid fa-arrow-left"></i> Home</a>
    </div>
  </header>

  <section class="bg-slate-900 text-white py-12">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <h1 class="text-3xl lg:text-4xl font-black">WHOLESALE & BULK ORDERS</h1>
      <p class="text-slate-300 text-sm max-w-xl mx-auto mt-1">Special institutional discounts for Schools, Academies, Professional Clubs, and Corporate Tournaments.</p>
    </div>
  </section>

  <main class="py-12 flex-1">
    <div class="max-w-4xl mx-auto px-4">
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 lg:p-10 shadow-sm">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-6 border-b pb-3">Submit Bulk Order Inquiry</h2>
        
        <form id="bulkOrderForm" class="space-y-4 text-xs font-semibold">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Full Name *</label>
              <input type="text" required placeholder="John Doe" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-3">
            </div>
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Organization / School / Club Name *</label>
              <input type="text" required placeholder="St. Xavier Sports Academy" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-3">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Email Address *</label>
              <input type="email" required placeholder="john@academy.com" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-3">
            </div>
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Phone / WhatsApp *</label>
              <input type="tel" required placeholder="+1 555 019 2831" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-3">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Product Category</label>
              <select class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-3">
                <option>Cricket Bats & Balls</option>
                <option>Match Footballs</option>
                <option>Team Uniform Kits</option>
                <option>Fitness & Training Cones</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Estimated Quantity</label>
              <input type="number" min="20" placeholder="e.g. 50" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-3">
            </div>
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Target Delivery Date</label>
              <input type="date" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-3">
            </div>
          </div>

          <div>
            <label class="block text-slate-600 dark:text-slate-400 mb-1">Additional Requirements</label>
            <textarea rows="4" placeholder="Describe specifications, branding, sizes required..." class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-3"></textarea>
          </div>

          <button type="submit" class="btn-sh-primary text-sm py-3.5 px-8">
            <i class="fa-solid fa-paper-plane mr-2"></i> Submit Quotation Request
          </button>
        </form>
      </div>
    </div>
  </section>

  <footer class="bg-slate-950 text-slate-400 py-8 text-center text-xs border-t border-slate-800 mt-auto">
    &copy; 2026 SportsHub Bulk Sales Department.
  </footer>

  <script src="assets/js/forms.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
