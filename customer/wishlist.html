<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Wishlist – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans flex flex-col min-h-screen">

  <header class="bg-white dark:bg-slate-900 border-b py-3 px-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-black text-xl">SPORTS<span class="text-red-600">HUB</span></a>
      <a href="dashboard.html" class="text-xs font-bold text-slate-500"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>
  </header>

  <main class="py-10 max-w-7xl mx-auto px-4 w-full flex-1">
    <h2 class="text-2xl font-black mb-6">MY SAVED WISHLIST</h2>
    <div id="wishlistGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
  </main>

  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/wishlist.js"></script>
  <script src="../assets/js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const list = window.SportsWishlist.getWishlist();
      const grid = document.getElementById('wishlistGrid');
      if (list.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-slate-500 text-xs">No saved wishlist items.</p>';
      } else {
        grid.innerHTML = list.map(p => window.renderProductCard(p)).join('');
      }
    });
  </script>
</body>
</html>
