<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Bulk Enquiries – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans flex flex-col min-h-screen">

  <header class="bg-white dark:bg-slate-900 border-b py-3 px-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-black text-xl">SPORTS<span class="text-red-600">HUB</span></a>
      <a href="dashboard.html" class="text-xs font-bold text-slate-500"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>
  </header>

  <main class="py-10 max-w-7xl mx-auto px-4 w-full flex-1">
    <h2 class="text-2xl font-black mb-6">BULK & WHOLESALE ENQUIRIES</h2>
    <div class="bg-white dark:bg-slate-900 border rounded-xl p-6 shadow-sm">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-100 dark:bg-slate-800 font-bold uppercase">
          <tr>
            <th class="p-3">Enquiry ID</th>
            <th class="p-3">Category</th>
            <th class="p-3">Quantity</th>
            <th class="p-3">Status</th>
            <th class="p-3">Quotation Price</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <tr>
            <td class="p-3 font-bold">#BLK-9041</td>
            <td class="p-3">Cricket Bats & Leather Balls</td>
            <td class="p-3">50 Units</td>
            <td class="p-3"><span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded font-bold">Quote Sent</span></td>
            <td class="p-3 font-bold">$4,850.00</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
