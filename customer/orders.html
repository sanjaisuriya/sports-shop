<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>My Orders – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans flex flex-col min-h-screen">

  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 py-3 px-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-black text-xl text-slate-900 dark:text-white">SPORTS<span class="text-red-600">HUB</span></a>
      <div class="flex items-center gap-4 text-xs font-bold">
        <button onclick="window.toggleTheme()" class="hover:text-red-600 flex items-center gap-1">
          <i class="fa-solid fa-moon sh-theme-icon-moon"></i>
          <i class="fa-solid fa-sun sh-theme-icon-sun hidden text-amber-400"></i>
          <span class="sh-theme-text">Theme</span>
        </button>
        <a href="dashboard.html" class="text-slate-600 dark:text-slate-300 hover:text-red-600"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <main class="py-10 max-w-7xl mx-auto px-4 w-full flex-1">
    <h2 class="text-2xl font-black mb-6">MY ORDER HISTORY</h2>
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 shadow-sm">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold uppercase">
          <tr>
            <th class="p-3">Order ID</th>
            <th class="p-3">Date</th>
            <th class="p-3">Items</th>
            <th class="p-3">Total Amount</th>
            <th class="p-3">Status</th>
            <th class="p-3">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
          <tr>
            <td class="p-3 font-bold">#SH-88401</td>
            <td class="p-3">Aug 15, 2026</td>
            <td class="p-3">3 Items</td>
            <td class="p-3 font-bold">$629.99</td>
            <td class="p-3"><span class="bg-green-100 dark:bg-green-950 text-green-700 dark:text-green-400 px-2 py-0.5 rounded font-bold">Delivered</span></td>
            <td class="p-3"><a href="order-details.html?id=SH-88401" class="text-red-600 font-bold">View Order</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
