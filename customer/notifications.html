<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Notifications – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans flex flex-col min-h-screen">

  <header class="bg-white dark:bg-slate-900 border-b py-3 px-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-black text-xl">SPORTS<span class="text-red-600">HUB</span></a>
      <a href="dashboard.html" class="text-xs font-bold text-slate-500"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>
  </header>

  <main class="py-10 max-w-4xl mx-auto px-4 w-full flex-1">
    <h2 class="text-2xl font-black mb-6">ACCOUNT NOTIFICATIONS</h2>
    <div class="bg-white dark:bg-slate-900 border rounded-xl p-6 shadow-sm space-y-3">
      <div class="flex items-start gap-3 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg text-xs">
        <i class="fa-solid fa-truck text-red-600 text-base mt-0.5"></i>
        <div>
          <h4 class="font-bold">Order #SH-88401 Delivered</h4>
          <p class="text-slate-500">Your shipment has arrived at Mumbai facility.</p>
          <span class="text-[10px] text-slate-400 mt-1 block">2 hours ago</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
