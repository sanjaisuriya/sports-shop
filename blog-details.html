<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Details – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl leading-none">SH</div>
        <span class="font-black text-xl text-slate-900 dark:text-white tracking-tight">SPORTS<span class="text-red-600">HUB</span></span>
      </a>
      <a href="blog.html" class="text-xs font-bold text-slate-500 hover:text-red-600"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Blog Articles</a>
    </div>
  </header>

  <main class="py-12 flex-1">
    <div class="max-w-3xl mx-auto px-4">
      <div id="blogDetailContainer" class="bg-white dark:bg-slate-900 border rounded-2xl p-6 lg:p-10 shadow-sm space-y-6">
        <p class="text-center text-slate-500 py-12">Loading article...</p>
      </div>
    </div>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-8 text-center text-xs border-t border-slate-800 mt-auto">
    &copy; 2026 SportsHub Media & Insights.
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const blogId = urlParams.get('id') || 'blog-1';

      function renderArticle(posts) {
        const post = posts.find(p => p.id === blogId) || posts[0];
        const container = document.getElementById('blogDetailContainer');
        if (!container) return;
        
        container.innerHTML = `
          <span class="text-xs font-bold text-red-600 uppercase tracking-widest">${post.category}</span>
          <h1 class="text-3xl font-black text-slate-900 dark:text-white leading-tight">${post.title}</h1>
          
          <div class="flex items-center gap-4 text-xs text-slate-400 border-b pb-4">
            <span><i class="fa-regular fa-user text-red-600 mr-1"></i> By ${post.author}</span>
            <span>•</span>
            <span><i class="fa-regular fa-calendar text-red-600 mr-1"></i> ${post.date}</span>
            <span>•</span>
            <span><i class="fa-regular fa-clock text-red-600 mr-1"></i> ${post.readTime}</span>
          </div>

          <div class="rounded-xl overflow-hidden h-80">
            <img src="${post.image}" alt="${post.title}" class="w-full h-full object-cover">
          </div>

          <div class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed space-y-4">
            <p class="text-base font-semibold text-slate-800 dark:text-slate-100 border-l-4 border-red-600 pl-4 py-1 italic">
              "${post.summary}"
            </p>
            <p>
              ${post.content || 'SportsHub equipment research lab analyzes impact dynamics, structural stress points, and ergonomic handles for peak competitive performance.'}
            </p>
            <h3 class="text-lg font-bold text-slate-900 dark:text-white pt-4">Key Insights & Takeaways</h3>
            <ul class="list-disc list-inside space-y-2 text-xs">
              <li>Check handle rubber elasticity and multi-piece cane construction.</li>
              <li>Inspect grain parallel alignment across the entire bat spine.</li>
              <li>Maintain balanced weight distribution for fast wrist snapping.</li>
            </ul>
          </div>

          <div class="border-t pt-6 flex items-center justify-between">
            <a href="blog.html" class="btn-sh-outline text-xs"><i class="fa-solid fa-arrow-left mr-1"></i> More Articles</a>
            <div class="flex gap-2 text-slate-400 text-sm">
              <span class="text-xs font-bold mr-2 text-slate-500">Share:</span>
              <a href="#" class="hover:text-red-600"><i class="fa-brands fa-facebook-f"></i></a>
              <a href="#" class="hover:text-red-600"><i class="fa-brands fa-twitter"></i></a>
              <a href="#" class="hover:text-red-600"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
          </div>
        `;
      }

      fetch('data/blog.json')
        .then(r => r.json())
        .then(posts => renderArticle(posts))
        .catch(() => renderArticle(window.BLOG_DATA || []));
    });
  </script>
</body>
</html>
