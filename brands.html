<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Brands Directory – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl leading-none">SH</div>
        <span class="font-black text-xl text-slate-900 dark:text-white tracking-tight">SPORTS<span class="text-red-600">HUB</span></span>
      </a>
      <nav class="hidden lg:flex items-center gap-6 font-semibold text-sm text-slate-700 dark:text-slate-200">
        <a href="index.html" class="hover:text-red-600">Home</a>
        <a href="cricket-home.html" class="hover:text-red-600">Cricket Special</a>
        <a href="shop.html" class="hover:text-red-600">Shop Catalog</a>
        <a href="categories.html" class="hover:text-red-600">Categories</a>
        <a href="brands.html" class="text-red-600 font-bold">Brands</a>
        <a href="team-kits.html" class="hover:text-red-600">Team Kits</a>
        <a href="blog.html" class="hover:text-red-600">Blog</a>
        <a href="contact.html" class="hover:text-red-600">Contact</a>
      </nav>
      <div class="flex items-center gap-4">
        <button onclick="window.toggleTheme()" class="hover:text-red-600 text-xs font-bold transition flex items-center gap-1">
          <i class="fa-solid fa-moon sh-theme-icon-moon"></i>
          <i class="fa-solid fa-sun sh-theme-icon-sun hidden text-amber-400"></i>
          <span class="sh-theme-text">Theme</span>
        </button>
        <a href="cart.html" class="relative p-2 text-slate-700 dark:text-slate-200">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span class="sh-cart-count absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </a>
      </div>
    </div>
  </header>

  <section class="bg-slate-900 text-white py-12">
    <div class="max-w-7xl mx-auto px-4">
      <h1 class="text-3xl font-black">AUTHORIZED BRAND PARTNERS</h1>
      <p class="text-slate-400 text-sm mt-1">Discover world-leading manufacturers of professional athletic equipment</p>
    </div>
  </section>

  <main class="py-12 flex-1">
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="brandsGrid"></div>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-8 text-center text-xs border-t border-slate-800 mt-auto">
    &copy; 2026 SportsHub Equipment Inc.
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      function renderBrands(brands) {
        const grid = document.getElementById('brandsGrid');
        if (!grid) return;
        grid.innerHTML = brands.map(b => `
          <div class="sh-card p-6 flex flex-col justify-between text-center">
            <div>
              <div class="w-20 h-20 mx-auto rounded-full bg-slate-100 dark:bg-slate-800 p-2 mb-4 overflow-hidden flex items-center justify-center">
                <img src="${b.logo}" alt="${b.name}" class="h-full w-full object-cover rounded-full">
              </div>
              <h3 class="font-extrabold text-slate-900 dark:text-white text-lg">${b.name}</h3>
              <span class="text-xs text-red-600 font-bold block mb-2">${b.productsCount}+ Products</span>
              <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${b.description}</p>
            </div>
            <a href="shop.html?brand=${b.slug}" class="btn-sh-outline text-xs justify-center mt-6">
              View Products <i class="fa-solid fa-arrow-right ml-1"></i>
            </a>
          </div>
        `).join('');
      }

      fetch('data/brands.json')
        .then(r => r.json())
        .then(brands => renderBrands(brands))
        .catch(() => renderBrands(window.BRANDS_DATA || []));
    });
  </script>
</body>
</html>
