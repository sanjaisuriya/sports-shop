<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-950 text-white font-sans flex flex-col min-h-screen items-center justify-center p-4 text-center">

  <div class="max-w-lg w-full space-y-6">
    <span class="bg-red-600 text-white text-xs font-black uppercase px-3 py-1 rounded tracking-widest">New Equipment Drop 2026</span>
    <h1 class="text-4xl font-black">WE'RE LAUNCHING SOMETHING BIG</h1>
    <p class="text-slate-400 text-sm">Next-generation carbon graphite cricket bats and smart biometric fitness wearables are almost here.</p>
    
    <!-- Countdown timer -->
    <div class="grid grid-cols-4 gap-3 py-4">
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
        <span class="text-3xl font-black text-red-500">14</span>
        <span class="block text-[10px] text-slate-400 uppercase font-bold">Days</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
        <span class="text-3xl font-black text-red-500">08</span>
        <span class="block text-[10px] text-slate-400 uppercase font-bold">Hours</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
        <span class="text-3xl font-black text-red-500">42</span>
        <span class="block text-[10px] text-slate-400 uppercase font-bold">Mins</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
        <span class="text-3xl font-black text-red-500">19</span>
        <span class="block text-[10px] text-slate-400 uppercase font-bold">Secs</span>
      </div>
    </div>

    <form class="sh-newsletter-form flex gap-2 max-w-sm mx-auto">
      <input type="email" placeholder="Enter email for VIP launch invite..." required class="px-4 py-2.5 rounded-lg text-slate-900 text-xs flex-1">
      <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg font-bold text-xs">Notify Me</button>
    </form>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
