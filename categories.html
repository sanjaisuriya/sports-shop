<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Categories – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl leading-none">SH</div>
        <span class="font-black text-xl text-slate-900 dark:text-white tracking-tight">SPORTS<span class="text-red-600">HUB</span></span>
      </a>
      <nav class="hidden lg:flex items-center gap-6 font-semibold text-sm text-slate-700 dark:text-slate-200">
        <a href="index.html" class="hover:text-red-600">Home</a>
        <a href="cricket-home.html" class="hover:text-red-600">Cricket Special</a>
        <a href="shop.html" class="hover:text-red-600">Shop Catalog</a>
        <a href="categories.html" class="text-red-600 font-bold">Categories</a>
        <a href="brands.html" class="hover:text-red-600">Brands</a>
        <a href="team-kits.html" class="hover:text-red-600">Team Kits</a>
        <a href="blog.html" class="hover:text-red-600">Blog</a>
        <a href="contact.html" class="hover:text-red-600">Contact</a>
      </nav>
      <div class="flex items-center gap-4">
        <button onclick="window.toggleTheme()" class="hover:text-red-600 text-xs font-bold transition flex items-center gap-1">
          <i class="fa-solid fa-moon sh-theme-icon-moon"></i>
          <i class="fa-solid fa-sun sh-theme-icon-sun hidden text-amber-400"></i>
          <span class="sh-theme-text">Theme</span>
        </button>
        <a href="cart.html" class="relative p-2 text-slate-700 dark:text-slate-200">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span class="sh-cart-count absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </a>
      </div>
    </div>
  </header>

  <section class="bg-slate-900 text-white py-12">
    <div class="max-w-7xl mx-auto px-4">
      <h1 class="text-3xl font-black">SPORTS DIRECTORY & CATEGORIES</h1>
      <p class="text-slate-400 text-sm mt-1">Select your favorite sport to filter match gear and apparel</p>
    </div>
  </section>

  <main class="py-12 flex-1">
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="categoriesGrid"></div>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-8 text-center text-xs border-t border-slate-800 mt-auto">
    &copy; 2026 SportsHub Equipment Inc.
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      function renderCategories(categories) {
        const grid = document.getElementById('categoriesGrid');
        if (!grid) return;
        grid.innerHTML = categories.map(c => `
          <div class="sh-card overflow-hidden group">
            <div class="h-48 overflow-hidden relative">
              <img src="${c.image}" alt="${c.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
              <div class="absolute bottom-4 left-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-red-600 text-white flex items-center justify-center text-xl">
                  <i class="fa-solid ${c.icon}"></i>
                </div>
                <div>
                  <h3 class="font-extrabold text-xl text-white">${c.name}</h3>
                  <span class="text-xs text-red-400 font-bold">${c.itemCount} Items</span>
                </div>
              </div>
            </div>
            <div class="p-4 flex flex-col justify-between h-32">
              <p class="text-xs text-slate-600 dark:text-slate-300">${c.description}</p>
              <a href="shop.html?category=${c.slug}" class="btn-sh-outline text-xs justify-center w-full mt-2">
                Browse ${c.name} Gear <i class="fa-solid fa-arrow-right ml-1"></i>
              </a>
            </div>
          </div>
        `).join('');
      }

      fetch('data/categories.json')
        .then(r => r.json())
        .then(categories => renderCategories(categories))
        .catch(() => renderCategories(window.CATEGORIES_DATA || []));
    });
  </script>
</body>
</html>
