<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Badminton Racket & Feather Shuttlecock -->
  <g filter="url(#shadow)" transform="translate(240, 60)">
    <!-- Racket Oval -->
    <ellipse cx="200" cy="130" rx="70" ry="95" fill="none" stroke="#a855f7" stroke-width="10"/>
    <!-- String Mesh -->
    <path d="M 140 130 L 260 130 M 150 90 L 250 90 M 150 170 L 250 170 M 200 50 L 200 210 M 170 60 L 170 200 M 230 60 L 230 200" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    <!-- Shaft & Grip -->
    <line x1="200" y1="225" x2="200" y2="350" stroke="#cbd5e1" stroke-width="5"/>
    <rect x="193" y="350" width="14" height="60" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>

    <!-- Goose Feather Shuttlecock -->
    <g transform="translate(40, 120)">
      <ellipse cx="30" cy="90" rx="16" ry="12" fill="#ef4444"/>
      <!-- Feathers -->
      <polygon points="14,88 -20,20 10,20" fill="#ffffff"/>
      <polygon points="22,88 10,10 30,10" fill="#ffffff"/>
      <polygon points="38,88 30,10 50,10" fill="#ffffff"/>
      <polygon points="46,88 50,20 80,20" fill="#ffffff"/>
      <path d="M -15 35 Q 30 30 75 35" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    </g>
  </g>

  <!-- Category Title -->
  <rect x="250" y="400" width="300" height="44" rx="22" fill="#9333ea"/>
  <text x="400" y="428" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">BADMINTON GEAR</text>
</svg>
