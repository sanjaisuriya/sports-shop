<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Sports Duffle Bag & Water Bottle Accessories -->
  <g filter="url(#shadow)" transform="translate(220, 80)">
    <!-- Duffle Bag -->
    <rect x="60" y="140" width="260" height="150" rx="30" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
    <path d="M 120 140 C 120 80 260 80 260 140" fill="none" stroke="#ffffff" stroke-width="8"/>
    <!-- Straps & Zipper -->
    <rect x="110" y="140" width="20" height="150" fill="#0f172a"/>
    <rect x="250" y="140" width="20" height="150" fill="#0f172a"/>
    <line x1="60" y1="180" x2="320" y2="180" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8,4"/>

    <!-- Water Bottle -->
    <g transform="translate(310, 100)">
      <rect x="20" y="60" width="50" height="180" rx="12" fill="#ef4444"/>
      <rect x="30" y="40" width="30" height="20" rx="4" fill="#0f172a"/>
      <rect x="35" y="20" width="20" height="20" rx="2" fill="#e2e8f0"/>
      <!-- Measurement Lines -->
      <line x1="30" y1="100" x2="45" y2="100" stroke="#ffffff" stroke-width="3"/>
      <line x1="30" y1="130" x2="45" y2="130" stroke="#ffffff" stroke-width="3"/>
      <line x1="30" y1="160" x2="45" y2="160" stroke="#ffffff" stroke-width="3"/>
    </g>
  </g>

  <!-- Category Title -->
  <rect x="230" y="400" width="340" height="44" rx="22" fill="#0284c7"/>
  <text x="400" y="428" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">SPORTS ACCESSORIES</text>
</svg>
