<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Football Stadium Grass Lines -->
  <line x1="100" y1="450" x2="700" y2="450" stroke="#ffffff" stroke-width="6" opacity="0.3"/>
  <circle cx="400" cy="450" r="140" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.3"/>

  <!-- Football Official Match Ball -->
  <g filter="url(#shadow)" transform="translate(400, 230)">
    <circle cx="0" cy="0" r="140" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Black Pentagons & Panels -->
    <polygon points="0,-70 55,-30 35,35 -35,35 -55,-30" fill="#0f172a"/>
    <polygon points="0,-140 30,-100 -30,-100" fill="#0f172a"/>
    <polygon points="120,-40 140,20 90,0" fill="#0f172a"/>
    <polygon points="-120,-40 -140,20 -90,0" fill="#0f172a"/>
    <polygon points="80,100 120,60 130,110" fill="#0f172a"/>
    <polygon points="-80,100 -120,60 -130,110" fill="#0f172a"/>
    <polygon points="0,140 40,110 -40,110" fill="#0f172a"/>
  </g>

  <!-- Category Title -->
  <rect x="250" y="390" width="300" height="44" rx="22" fill="#10b981"/>
  <text x="400" y="418" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">FOOTBALL GEAR</text>
</svg>
