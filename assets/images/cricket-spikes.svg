<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="270" r="210" fill="#2563eb" opacity="0.08"/>

  <!-- Cricket Spikes Shoe -->
  <g filter="url(#shadow)" transform="translate(140, 100)">
    <!-- Main Shoe Upper -->
    <path d="M 60 260 L 90 140 C 130 110 240 130 320 180 C 400 230 460 250 500 260 C 530 270 540 290 520 310 C 470 330 380 330 300 330 L 60 330 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- REVlite Midsole -->
    <path d="M 50 330 L 530 330 C 540 345 520 365 480 365 L 70 365 C 50 365 40 345 50 330 Z" fill="url(#nbGrad)"/>

    <!-- Outsole & Metal Turf Spikes -->
    <rect x="60" y="365" width="440" height="15" fill="#0f172a"/>
    <!-- Spikes Teeth -->
    <polygon points="100,380 110,400 120,380" fill="#cbd5e1"/>
    <polygon points="170,380 180,400 190,380" fill="#cbd5e1"/>
    <polygon points="240,380 250,400 260,380" fill="#cbd5e1"/>
    <polygon points="380,380 390,400 400,380" fill="#cbd5e1"/>
    <polygon points="440,380 450,400 460,380" fill="#cbd5e1"/>

    <!-- NB Logo Accent -->
    <path d="M 210 180 L 260 250 L 240 250 L 200 195 Z" fill="#2563eb"/>
    <path d="M 230 180 L 280 250 L 300 250 L 250 180 Z" fill="#dc2626"/>

    <!-- Laces & Tongue -->
    <path d="M 130 145 L 250 205" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10,6"/>
  </g>

  <!-- Title Badge -->
  <rect x="200" y="450" width="400" height="50" rx="25" fill="#2563eb"/>
  <text x="400" y="482" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">NB CRICKET SPIKES SHOES</text>
</svg>
