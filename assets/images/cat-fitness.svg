<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Dumbbells & Gym Weight -->
  <g filter="url(#shadow)" transform="translate(250, 120)">
    <!-- Barbell Shaft -->
    <rect x="20" y="100" width="260" height="20" rx="4" fill="#cbd5e1"/>
    <!-- Weight Plates Left -->
    <rect x="40" y="40" width="25" height="140" rx="8" fill="#ef4444"/>
    <rect x="65" y="60" width="20" height="100" rx="6" fill="#0f172a"/>
    <!-- Weight Plates Right -->
    <rect x="235" y="40" width="25" height="140" rx="8" fill="#ef4444"/>
    <rect x="215" y="60" width="20" height="100" rx="6" fill="#0f172a"/>
    <!-- Grip -->
    <rect x="110" y="95" width="80" height="30" rx="6" fill="#64748b"/>
  </g>

  <!-- Category Title -->
  <rect x="250" y="400" width="300" height="44" rx="22" fill="#ef4444"/>
  <text x="400" y="428" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">FITNESS &amp; GYM GEAR</text>
</svg>
