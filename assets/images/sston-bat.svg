<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Turf Pattern -->
    <linearGradient id="turfGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Premium Dark Willow Wood Texture -->
    <linearGradient id="willowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eedcb9"/>
      <stop offset="30%" stop-color="#f7ebd7"/>
      <stop offset="60%" stop-color="#e2cfad"/>
      <stop offset="100%" stop-color="#d3bc94"/>
    </linearGradient>

    <!-- Handle Rubber Grip Blue -->
    <linearGradient id="gripGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Turf & Pitch -->
  <rect width="800" height="600" fill="url(#bgGrad2)"/>
  <ellipse cx="400" cy="480" rx="360" ry="90" fill="url(#turfGrad2)" opacity="0.9"/>

  <!-- Bat Shadow -->
  <ellipse cx="380" cy="510" rx="220" ry="25" fill="#000000" opacity="0.5"/>

  <!-- CRICKET BAT GRAPHIC (Diagonal Placement) -->
  <g transform="translate(400, 300) rotate(-30) translate(-400, -300)">
    
    <!-- Rubber Grip Handle Top -->
    <rect x="382" y="50" width="36" height="180" rx="18" fill="url(#gripGrad2)"/>
    <!-- Grip Texturing -->
    <line x1="382" y1="70" x2="418" y2="70" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="382" y1="90" x2="418" y2="90" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="382" y1="110" x2="418" y2="110" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="382" y1="130" x2="418" y2="130" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="382" y1="150" x2="418" y2="150" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="382" y1="170" x2="418" y2="170" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="382" y1="190" x2="418" y2="190" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="382" y1="210" x2="418" y2="210" stroke="#1e3a8a" stroke-width="2"/>

    <!-- Handle Splice Connection -->
    <polygon points="385,210 415,210 410,240 390,240" fill="#b45309"/>

    <!-- Willow Bat Blade -->
    <path d="M 370 230 
             C 365 250, 360 300, 360 440 
             C 360 480, 375 500, 400 500 
             C 425 500, 440 480, 440 440 
             C 440 300, 435 250, 430 230 
             Z" 
          fill="url(#willowGrad2)" stroke="#b45309" stroke-width="3"/>

    <!-- Wood Grains -->
    <path d="M 375 250 L 375 480" stroke="#c7a77e" stroke-width="1.5" opacity="0.6"/>
    <path d="M 388 240 L 388 490" stroke="#c7a77e" stroke-width="1.5" opacity="0.6"/>
    <path d="M 400 235 L 400 495" stroke="#c7a77e" stroke-width="2" opacity="0.7"/>
    <path d="M 412 240 L 412 490" stroke="#c7a77e" stroke-width="1.5" opacity="0.6"/>
    <path d="M 425 250 L 425 480" stroke="#c7a77e" stroke-width="1.5" opacity="0.6"/>

    <!-- Spine High-Power Ridge Highlight -->
    <path d="M 400 240 L 400 485" stroke="#ffffff" stroke-width="3" opacity="0.35"/>

    <!-- SS Brand Sticker Header -->
    <rect x="365" y="250" width="70" height="95" rx="6" fill="#0284c7"/>
    <rect x="368" y="253" width="64" height="89" rx="4" fill="#0f172a"/>
    <text x="400" y="285" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#eab308" text-anchor="middle">SS</text>
    <text x="400" y="310" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">TON</text>
    <text x="400" y="330" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#38bdf8" text-anchor="middle">RESERVE EDITION</text>

    <!-- Lower Blade Sticker -->
    <rect x="372" y="415" width="56" height="35" rx="4" fill="#1e1b4b"/>
    <text x="400" y="437" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#facc15" text-anchor="middle">GRADE 1 WILLOW</text>
  </g>

  <!-- Text Overlay -->
  <rect x="40" y="40" width="260" height="46" rx="8" fill="#000000" opacity="0.6"/>
  <text x="55" y="70" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#ffffff">SS TON RESERVE BAT</text>
</svg>
