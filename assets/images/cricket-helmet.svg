<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="270" r="210" fill="#2563eb" opacity="0.08"/>

  <!-- Helmet Body -->
  <g filter="url(#shadow)" transform="translate(200, 70)">
    <!-- Main Shell -->
    <path d="M 80 230 C 60 120 160 50 260 50 C 360 50 440 120 420 230 C 420 270 380 300 320 300 L 140 300 C 90 300 80 270 80 230 Z" fill="url(#navyGrad)" stroke="#3b82f6" stroke-width="3"/>
    <!-- Peak / Visor -->
    <path d="M 300 130 L 440 150 L 420 180 L 290 150 Z" fill="#0284c7"/>
    <!-- Ear Protection Pads -->
    <circle cx="210" cy="250" r="45" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Titanium Grille Bars -->
    <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
      <path d="M 230 200 L 420 200 L 390 270 L 230 270 Z" fill="none"/>
      <line x1="230" y1="225" x2="410" y2="225"/>
      <line x1="230" y1="248" x2="400" y2="248"/>
      <line x1="310" y1="195" x2="310" y2="275"/>
      <line x1="360" y1="198" x2="350" y2="275"/>
    </g>

    <!-- Chin Strap -->
    <path d="M 210 280 Q 260 360 320 330" fill="none" stroke="#64748b" stroke-width="6"/>
    <rect x="260" y="335" width="50" height="16" rx="8" fill="#e2e8f0"/>

    <!-- Brand Emblem -->
    <rect x="230" y="80" width="60" height="30" rx="6" fill="#dc2626"/>
    <text x="260" y="100" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">GN</text>
  </g>

  <!-- Title Badge -->
  <rect x="210" y="450" width="380" height="50" rx="25" fill="#2563eb"/>
  <text x="400" y="482" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">GRAY-NICOLLS HELMET</text>
</svg>
