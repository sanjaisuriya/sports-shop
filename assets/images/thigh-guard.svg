<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="270" r="210" fill="#3b82f6" opacity="0.08"/>

  <!-- SS Ton Dual Thigh Guard Combo -->
  <g filter="url(#shadow)" transform="translate(180, 80)">
    <!-- Outer Thigh Guard Pad -->
    <path d="M 80 60 C 180 40 280 80 260 280 C 240 360 160 380 90 340 C 60 300 50 140 80 60 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Foam Ridge -->
    <path d="M 100 90 Q 180 70 230 250 Q 210 320 120 310 Z" fill="#f1f5f9"/>
    
    <!-- Inner Thigh Guard Pad -->
    <path d="M 280 100 C 350 90 400 120 390 280 C 380 340 330 350 280 320 C 260 280 250 160 280 100 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>

    <!-- Elastic Velocity Straps -->
    <rect x="50" y="160" width="360" height="24" rx="12" fill="url(#blueGrad)"/>
    <rect x="60" y="270" width="340" height="24" rx="12" fill="url(#blueGrad)"/>

    <!-- SS Brand Logo -->
    <circle cx="160" cy="200" r="28" fill="#dc2626"/>
    <text x="160" y="208" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">SS</text>
  </g>

  <!-- Title Badge -->
  <rect x="200" y="450" width="400" height="50" rx="25" fill="#1d4ed8"/>
  <text x="400" y="482" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">SS TON THIGH GUARD COMBO</text>
</svg>
