<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad4)"/>

  <!-- Left Batting Pad -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="130" height="420" rx="30" fill="url(#padGrad)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Knee Roll Vertical Ridges -->
    <rect x="15" y="140" width="100" height="70" rx="10" fill="#dc2626"/>
    <text x="65" y="180" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">TEST PRO</text>
    <!-- Vertical Protection Bolsters -->
    <line x1="32" y1="20" x2="32" y2="400" stroke="#94a3b8" stroke-width="4"/>
    <line x1="65" y1="20" x2="65" y2="400" stroke="#94a3b8" stroke-width="4"/>
    <line x1="98" y1="20" x2="98" y2="400" stroke="#94a3b8" stroke-width="4"/>
  </g>

  <!-- Right Batting Pad -->
  <g transform="translate(410, 80)">
    <rect x="0" y="0" width="130" height="420" rx="30" fill="url(#padGrad)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Knee Roll Vertical Ridges -->
    <rect x="15" y="140" width="100" height="70" rx="10" fill="#dc2626"/>
    <text x="65" y="180" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">TEST PRO</text>
    <!-- Vertical Protection Bolsters -->
    <line x1="32" y1="20" x2="32" y2="400" stroke="#94a3b8" stroke-width="4"/>
    <line x1="65" y1="20" x2="65" y2="400" stroke="#94a3b8" stroke-width="4"/>
    <line x1="98" y1="20" x2="98" y2="400" stroke="#94a3b8" stroke-width="4"/>
  </g>

  <!-- Pair of Test Batting Gloves in Front -->
  <g transform="translate(320, 360)">
    <rect x="0" y="0" width="70" height="90" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <rect x="85" y="0" width="70" height="90" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <rect x="10" y="10" width="50" height="25" rx="5" fill="#dc2626"/>
    <rect x="95" y="10" width="50" height="25" rx="5" fill="#dc2626"/>
  </g>

  <!-- Text Badge -->
  <rect x="40" y="40" width="340" height="46" rx="8" fill="#000000" opacity="0.7"/>
  <text x="55" y="70" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#ffffff">KOOKABURRA TEST GEAR</text>
</svg>
