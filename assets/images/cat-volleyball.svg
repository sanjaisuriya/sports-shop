<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Volleyball & Net -->
  <g filter="url(#shadow)" transform="translate(400, 210)">
    <circle cx="0" cy="0" r="130" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- 18 Panel Swoosh Stripes -->
    <path d="M -130 0 C -60 -100 60 -100 130 0" fill="none" stroke="#2563eb" stroke-width="24"/>
    <path d="M -130 0 C -60 100 60 100 130 0" fill="none" stroke="#eab308" stroke-width="24"/>
  </g>

  <!-- Category Title -->
  <rect x="260" y="400" width="280" height="44" rx="22" fill="#0284c7"/>
  <text x="400" y="428" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">VOLLEYBALL GEAR</text>
</svg>
