<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="stadiumLight" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Deep Blue Dark Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#gridPattern)"/>

  <!-- Stadium Floodlight Glow -->
  <circle cx="960" cy="200" r="700" fill="url(#stadiumLight)"/>

  <!-- Dynamic Athletic Curved Waves -->
  <path d="M -100 800 C 400 600 1200 950 2020 700 L 2020 1080 L -100 1080 Z" fill="#dc2626" opacity="0.08"/>
  <path d="M -100 900 C 600 700 1400 1000 2020 850 L 2020 1080 L -100 1080 Z" fill="#2563eb" opacity="0.08"/>

  <!-- Subtle Floating Sports Icon Silhouettes -->
  <g opacity="0.04" fill="#ffffff" transform="translate(150, 180) scale(1.5)">
    <circle cx="100" cy="100" r="80"/>
  </g>
  <g opacity="0.04" fill="#ffffff" transform="translate(1600, 250) scale(1.8)">
    <polygon points="100,20 180,180 20,180"/>
  </g>
</svg>
