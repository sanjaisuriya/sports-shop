<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Basketball & Hoop -->
  <g filter="url(#shadow)" transform="translate(300, 80)">
    <!-- Basketball Rim -->
    <ellipse cx="100" cy="90" rx="90" ry="25" fill="none" stroke="#ea580c" stroke-width="12"/>
    <!-- Net -->
    <path d="M 20 90 L 40 220 L 160 220 L 180 90 M 50 90 L 70 220 M 150 90 L 130 220 M 80 90 L 100 220 M 120 90 L 100 220" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Basketball Ball -->
    <g transform="translate(100, 200)">
      <circle cx="0" cy="0" r="75" fill="#f97316" stroke="#0f172a" stroke-width="4"/>
      <path d="M -75 0 L 75 0 M 0 -75 L 0 75" stroke="#0f172a" stroke-width="4"/>
      <path d="M -50 -55 Q 0 0 -50 55 M 50 -55 Q 0 0 50 55" fill="none" stroke="#0f172a" stroke-width="4"/>
    </g>
  </g>

  <!-- Category Title -->
  <rect x="250" y="400" width="300" height="44" rx="22" fill="#ea580c"/>
  <text x="400" y="428" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">BASKETBALL GEAR</text>
</svg>
