<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Team Kit Studio – SportsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="bg-red-600 text-white p-2 rounded-lg font-black text-xl leading-none">SH</div>
        <span class="font-black text-xl text-slate-900 dark:text-white tracking-tight">TEAM<span class="text-red-600">STUDIO</span></span>
      </a>
      <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-red-600"><i class="fa-solid fa-arrow-left"></i> Return Home</a>
    </div>
  </header>

  <section class="bg-slate-900 text-white py-12">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <span class="bg-red-600 text-white text-xs font-black px-3 py-1 rounded uppercase tracking-widest mb-2 inline-block">Sublimated Custom Apparel</span>
      <h1 class="text-3xl lg:text-5xl font-black">INTERACTIVE TEAM KIT CUSTOMIZER</h1>
      <p class="text-slate-300 text-sm max-w-xl mx-auto mt-2">Design custom sublimated jerseys for Cricket, Football, School, and Corporate Sports Teams.</p>
    </div>
  </section>

  <main class="py-12 flex-1">
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
      
      <!-- Live Jersey Preview Box -->
      <div class="flex flex-col items-center">
        <div class="kit-preview-container">
          <!-- Jersey SVG Shape -->
          <svg class="kit-jersey-svg" viewBox="0 0 100 100">
            <path id="kitJerseyPath" d="M 30,15 L 42,22 L 58,22 L 70,15 L 90,30 L 78,45 L 75,40 L 75,90 L 25,90 L 25,40 L 22,45 L 10,30 Z" fill="#dc2626" stroke="#0f172a" stroke-width="1.5"/>
          </svg>
          <div id="kitDisplayName" class="kit-player-name">PLAYER</div>
          <div id="kitDisplayNumber" class="kit-player-number">10</div>
        </div>
        <p class="text-xs text-slate-500 mt-3 text-center"><i class="fa-solid fa-eye text-red-600 mr-1"></i> Live 2D Sublimation Preview Canvas</p>
      </div>

      <!-- Controls & Order Request Form -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 lg:p-8 shadow-sm">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-6 border-b pb-3">Kit Configuration</h2>
        
        <form id="teamKitForm" class="space-y-4 text-xs font-semibold">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Sport Type</label>
              <select class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-2.5">
                <option>Cricket Kit</option>
                <option>Football Jersey</option>
                <option>Basketball Singlet</option>
                <option>Volleyball Kit</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Primary Color</label>
              <select id="kitColorSelect" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-2.5">
                <option value="#dc2626">Crimson Red</option>
                <option value="#2563eb">Royal Blue</option>
                <option value="#059669">Emerald Green</option>
                <option value="#d97706">Amber Gold</option>
                <option value="#0f172a">Navy Black</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Sample Player Name</label>
              <input type="text" id="kitPlayerName" placeholder="e.g. SMITH" value="SMITH" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-2.5 uppercase">
            </div>
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Sample Jersey Number</label>
              <input type="number" id="kitPlayerNumber" placeholder="e.g. 7" value="7" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-2.5">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Total Quantity (Min: 10)</label>
              <input type="number" min="10" value="15" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-2.5">
            </div>
            <div>
              <label class="block text-slate-600 dark:text-slate-400 mb-1">Contact Email</label>
              <input type="email" placeholder="manager@club.com" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-2.5">
            </div>
          </div>

          <div>
            <label class="block text-slate-600 dark:text-slate-400 mb-1">Customization Notes / Logo Specs</label>
            <textarea rows="3" placeholder="Specify team name, sleeve logos, collar style..." class="w-full bg-slate-100 dark:bg-slate-800 border rounded-lg p-2.5"></textarea>
          </div>

          <button type="submit" class="btn-sh-primary w-full justify-center text-sm py-3 mt-4">
            <i class="fa-solid fa-paper-plane mr-2"></i> Submit Team Kit Enquiry
          </button>
        </form>
      </div>

    </div>
  </section>

  <footer class="bg-slate-950 text-slate-400 py-8 text-center text-xs border-t border-slate-800 mt-auto">
    &copy; 2026 SportsHub Custom Team Apparel Studio.
  </footer>

  <script src="assets/js/cart.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
